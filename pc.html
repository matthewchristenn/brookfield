<html>

<style>
body{
    background:black;
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.pc{
    position:relative;
}

img {
    position: relative;
    z-index: 2;
    width: 650px;
    pointer-events: none;
}

iframe {
    position: absolute;
    top: 90px;
    left: 130px;
    width: 360px;
    height: 270px;
    border: none;
    z-index: 1;
}

.screen {
    position: absolute;
    top: 62px;
    left: 150px;
    width: 345px;
    height: 260px;
    cursor: pointer;
    z-index: 3;
}
</style>
</head>

<body>

    <div class="pc">

        <img src="pc16.png">
    
        <div id="button" class="screen"
             onclick="playVideo()"></div>
    
        <iframe
            id="video"
            src="">
        </iframe>
    
    </div>

<script>
function playVideo() {

document.getElementById("video").src =
   "https://www.youtube.com/embed/z2X4EVhDQr8?autoplay=1";

document.getElementById("button").style.display = "none";
}
</script>

</body>
</html>
