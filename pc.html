<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    background: black;
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.pc{
    position: relative;
}

img{
    position: relative;
    z-index: 2;
    width: 650px;
    pointer-events: none;
}

iframe{
    position: absolute;
    top: 90px;
    left: 130px;
    width: 360px;
    height: 270px;
    border: none;
    z-index: 1;
}

.screen{
    position: absolute;
    top: 62px;
    left: 150px;
    width: 345px;
    height: 260px;
    cursor: pointer;
    z-index: 3;
}
</style>
</head>

<body>

<audio id="ambient" autoplay>
    <source src="windows-7-privetstvie.mp3" type="audio/mpeg">
</audio>

<div class="pc">

    <img src="pc16.png" alt="Комп'ютер">

    <div id="button" class="screen"></div>

    <iframe
        id="video"
        src=""
        allow="autoplay; encrypted-media"
        allowfullscreen>
    </iframe>

</div>

<script>
const button = document.getElementById("button");

function playVideo() {
    document.getElementById("video").src =
        "https://www.youtube.com/embed/z2X4EVhDQr8?autoplay=1";

    button.style.display = "none";
}

// Працює і на ПК, і на телефонах
button.addEventListener("pointerdown", playVideo);
</script>

</body>
</html>
