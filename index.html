<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<body>

    <audio id="ambient" autoplay loop>
        <source src="staticheskiy-tv-shum-2.mp3" type="audio/mpeg">
    </audio>

    <audio id="errorSound">
    <source src="windows-xp-kriticheskaya-oshybka.mp3" type="audio/mpeg">
</audio>
    
   
    </body>

<style>
body{
    background:black;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;

}

input{
    width:250px;
    padding:15px;
    background:black;
    border:2px solid #00ff00;
    color:#00ff00;
    font-size:25px;
    text-align:center;
}

input::placeholder{
    color:#00aa00;
}

#message {
    position: fixed;
    top: 30px;
    left: 50%;
    transform: translateX(-50%);
    color: #00ff00;
    font-size: 20px;
    font-family: monospace;
    text-align: center;
}
</style>
</head>

<body>

<input id="code" placeholder="Введіть код">

<script>

const input = document.getElementById("code");

input.addEventListener("input", function () {

    if (this.value.length === 4) {

        if (this.value === "1611") {

            window.location.href = "pc.html";

        } else if (this.value === "6037") {

            const msg = document.getElementById("message");

msg.innerText = "Тимчасово пошта не працює";

setTimeout(() => {
    msg.innerText = "";
}, 6000);

this.value = "";

        } else {

            document.getElementById("errorSound").play();

            this.value = "";
        }
    }
});

</script>

<p id="message"></p>





</body>
</html>
